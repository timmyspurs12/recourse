name: CI

# Everything here runs without a GenLayer network: domain, adversarial, auth,
# finality/appeal and forum tests (npm test), lint and types, and the contract
# in genlayer-test Direct Mode. On-network checks stay opt-in (npm run
# test:live, npm run genlayer:appeal) because a public network's congestion is
# not a property of this code.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint
      # Route types are generated by Next; tsc needs them to check pages.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test

  contract:
    name: Contract (genlayer-test Direct Mode)
    runs-on: ubuntu-latest
    env:
      # The GenVM release that ships the runner pinned on line 2 of the
      # contract (py-genlayer:babwp9t3…). Change both together.
      GENVM_VERSION: v0.6.0-rc9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m pytest tests/contracts -q
