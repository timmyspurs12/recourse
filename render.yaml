services:
  - type: web
    name: recourse
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/network
    disk:
      # The protocol ledger. Without a persistent disk, protected transactions
      # are lost on every deploy.
      name: recourse-ledger
      mountPath: /app/.recourse
      sizeGB: 1
    envVars:
      # Studio Next (Consensus v0.6, chain 61997) — the network the hackathon
      # requires. The contract address is written by `npm run genlayer:deploy`;
      # set GENLAYER_CONTRACT_ADDRESS here once you have one.
      - key: GENLAYER_NETWORK
        value: studio-next
      # Every adjudication on a fee-charging network spends GEN from this key.
      - key: GENLAYER_PRIVATE_KEY
        sync: false
      - key: RECOURSE_REQUIRE_AUTH
        value: "1"
      - key: RECOURSE_STORE_FILE
        value: /app/.recourse/ledger.json
